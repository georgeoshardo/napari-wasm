package:
  name: rstar-python
  version: 0.2.0
  tag:
    - rust
  top-level:
    - rstar_python
source:
  url: https://files.pythonhosted.org/packages/51/cd/f9f9e9225ca0438dd46ebc5c350a8a6c8f2dbc5ed37896b0f941a6464c14/rstar_python-0.2.0.tar.gz
  sha256: 42d3dba2e5b3054238a85d644a499d51d5a532e1c97095095d31f193ab96618b
build:
  # built with RUST_TOOLCHAIN=nightly-2026-08-18, as pydantic_core is
  script: |
    export RUSTFLAGS="-C link-arg=-sSIDE_MODULE=2 -Z link-native-libraries=yes -C target-feature=+atomics,+bulk-memory,+mutable-globals"
requirements:
  run:
    - numpy
  executable:
    - rustup
about:
  home: https://github.com/kephale/rstar-python
  PyPI: https://pypi.org/project/rstar-python
  summary: Python bindings for the rstar R*-tree spatial index
  license: MIT
