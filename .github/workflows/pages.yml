name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the threaded Pyodide with Qt, PyQt6 and its packages, which take hours
      # to build: built with threads/ and packed by threads/site_files.py
      - name: Download the threaded build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download threaded-build --pattern site-files.tar.gz
          tar xzf site-files.tar.gz

      - name: Build the vispy wheel
        run: python3 web/make_vispy_wheel.py

      - name: Assemble the site
        run: |
          mkdir -p _site/web/wheels
          cp index.html isolation.js LICENSE _site/
          cp web/*.py _site/web/
          cp web/wheels/*.whl _site/web/wheels/
          cp -R build _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
